<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ username }}'s Favorites | Movie Mania</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
    <h1>{{ username }}'s Favorites</h1>
    <p>Here are the movies you have favorited:</p>
    <ul class="list-group">
        {% if favorites %}
            {% for movie in favorites %}
            <li class="list-group-item">{{ movie }}</li>
            {% endfor %}
        {% else %}
            <li class="list-group-item">No favorites yet!</li>
        {% endif %}
    </ul>

    <a href="{{ url_for('home') }}" class="btn btn-primary mt-4">Back to Home</a>
</div>
</body>
</html>
