<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Mania</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="text-center mb-3">🎥 Movie Roulette 🎲</h1>
    <h5 class="text-center text-muted">Spin the genre wheel and uncover your next favorite movie!</h5>

    <!-- Mood-Based Recommendation -->
    <div class="card p-4 mt-4">
        <h2>How are you feeling today?</h2>
        <form id="moodForm">
            <div class="form-group">
                <select id="moodDropdown" class="form-control" required>
                    <option value="" disabled selected>Select your mood</option>
                    <option value="happy">Happy</option>
                    <option value="sad">Sad</option>
                    <option value="excited">Excited</option>
                    <option value="curious">Curious</option>
                    <option value="relaxed">Relaxed</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendation</button>
        </form>
        <div id="moodMovieDetails" class="mt-4 p-3 border rounded bg-light" style="display: none;">
            <!-- Recommendation details will be displayed here dynamically -->
        </div>
    </div>
</div>

<script>
    document.getElementById('moodForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const mood = document.getElementById('moodDropdown').value;
        const moodMovieDetailsDiv = document.getElementById('moodMovieDetails');

        if (!mood) {
            alert('Please select your mood.');
            return;
        }

        // Fetch and display the movie details
        await fetchAndDisplayMovie(mood, moodMovieDetailsDiv);
    });

    async function fetchAndDisplayMovie(mood, container) {
        try {
            const response = await fetch(`/movies/by_mood?mood=${encodeURIComponent(mood)}`);
            if (response.ok) {
                const movie = await response.json();
                container.style.display = 'block'; // Make the results visible
                container.innerHTML = `
                    <h5>${movie.title}</h5>
                    <p><strong>Overview:</strong> ${movie.overview || 'No overview available.'}</p>
                    <p><strong>Release Date:</strong> ${movie.release_date || 'Unknown'}</p>
                    <p><strong>Rating:</strong> ${movie.vote_average || 'N/A'}</p>
                    <button id="anotherOption" class="btn btn-secondary mt-3">Show Me Another Option</button>
                `;

                // Add event listener for "Show Me Another Option" button
                document.getElementById('anotherOption').addEventListener('click', async () => {
                    await fetchAndDisplayMovie(mood, container);
                });
            } else {
                const errorData = await response.json();
                container.style.display = 'block';
                container.innerHTML = `<p>${errorData.message}</p>`;
            }
        } catch (error) {
            console.error('Error fetching movie by mood:', error);
            container.style.display = 'block';
            container.innerHTML = `<p>An error occurred. Please try again later.</p>`;
        }
    }
</script>

</body>
</html>
