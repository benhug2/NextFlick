<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Mania</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="text-center mb-3">🎥 Movie Mania 🎬</h1>
    <h5 class="text-center text-muted">Movies tailored to your mood and language</h5>

    <!-- Mood and Language-Based Recommendation -->
    <div class="card p-4 mt-4">
        <h2>How are you feeling today?</h2>
        <form id="moodLanguageForm">
            <div class="form-group">
                <label for="moodDropdown">Select your mood:</label>
                <select id="moodDropdown" class="form-control" required>
                    <option value="" disabled selected>Select your mood</option>
                    <option value="happy">Happy</option>
                    <option value="sad">Sad</option>
                    <option value="excited">Excited</option>
                    <option value="curious">Curious</option>
                    <option value="relaxed">Relaxed</option>
                </select>
            </div>
            <div class="form-group">
                <label for="languageDropdown">Select your language:</label>
                <select id="languageDropdown" class="form-control" required>
                    <option value="" disabled selected>Select your language</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Get Recommendation</button>
        </form>
        <div id="moodMovieDetails" class="mt-4 p-3 border rounded bg-light" style="display: none;">
            <!-- Recommendation details will be displayed here dynamically -->
        </div>
    </div>
</div>

<script>
    let currentMood = '';
    let currentLanguage = '';

    document.getElementById('moodLanguageForm').addEventListener('submit', async (event) => {
        event.preventDefault();

        const mood = document.getElementById('moodDropdown').value;
        const language = document.getElementById('languageDropdown').value;
        currentMood = mood;
        currentLanguage = language;
        const moodMovieDetailsDiv = document.getElementById('moodMovieDetails');

        if (!mood || !language) {
            alert('Please select both your mood and language.');
            return;
        }

        try {
            const response = await fetch(`/movies/by_mood_and_language?mood=${encodeURIComponent(mood)}&language=${encodeURIComponent(language)}`);
            if (response.ok) {
                const movie = await response.json();
                displayMovieDetails(movie, moodMovieDetailsDiv);
            } else {
                const errorData = await response.json();
                moodMovieDetailsDiv.style.display = 'block';
                moodMovieDetailsDiv.innerHTML = `<p>${errorData.message}</p>`;
            }
        } catch (error) {
            console.error('Error fetching movie:', error);
            moodMovieDetailsDiv.style.display = 'block';
            moodMovieDetailsDiv.innerHTML = `<p>An error occurred. Please try again later.</p>`;
        }
    });

    function displayMovieDetails(movie, container) {
        container.style.display = 'block';
        container.innerHTML = `
            <h5>${movie.title}</h5>
            <p><strong>Overview:</strong> ${movie.overview || 'No overview available.'}</p>
            <p><strong>Release Date:</strong> ${movie.release_date || 'Unknown'}</p>
            <p><strong>Rating:</strong> ${movie.vote_average || 'N/A'}</p>
            <button id="showAnother" class="btn btn-secondary mt-3">Show Me Another Option</button>
        `;

        document.getElementById('showAnother').addEventListener('click', async () => {
            try {
                const response = await fetch(`/movies/by_mood_and_language?mood=${encodeURIComponent(currentMood)}&language=${encodeURIComponent(currentLanguage)}`);
                if (response.ok) {
                    const newMovie = await response.json();
                    displayMovieDetails(newMovie, container);
                } else {
                    alert('Failed to fetch another movie. Please try again.');
                }
            } catch (error) {
                console.error('Error fetching another movie:', error);
            }
        });
    }
</script>

</body>
</html>
