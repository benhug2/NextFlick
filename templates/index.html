<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie API UI</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light">

<div class="container my-5">
    <h1 class="text-center mb-5">Welcome to the Movie API</h1>

    <!-- Sign Up Section -->
    <div class="card p-4 mb-4">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <div class="form-group">
                <input type="text" id="signupUsername" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="signupPassword" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </div>

    <!-- Login Section -->
    <div class="card p-4 mb-4">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="loginUsername" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-success">Login</button>
        </form>
    </div>

    <!-- Search Movies Section -->
    <div class="card p-4 mb-4">
        <h2>Search Movies</h2>
        <form id="searchForm">
            <div class="form-group">
                <input type="text" id="searchQuery" class="form-control" placeholder="Search for a movie">
            </div>
            <button type="submit" class="btn btn-info">Search</button>
        </form>
        <div id="searchResults" class="mt-3"></div>
    </div>
</div>

<!-- Inline JavaScript for form handling -->
<script>
    document.getElementById('signupForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('signupUsername').value;
        const password = document.getElementById('signupPassword').value;

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            alert(data.message);
            document.getElementById('signupForm').reset();
        } catch (error) {
            console.error("Signup error:", error);
            alert("An error occurred during sign-up.");
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            alert(data.message);
            document.getElementById('loginForm').reset();
        } catch (error) {
            console.error("Login error:", error);
            alert("An error occurred during login.");
        }
    });

    document.getElementById('searchForm').addEventListener('submit', async (event) => {
        console.log("Search form submitted"); // Debugging statement
        event.preventDefault();
        const query = document.getElementById('searchQuery').value;

        try {
            const response = await fetch(`/movies/search?query=${encodeURIComponent(query)}`);
            
            if (response.ok) {
                const movies = await response.json();
                const resultsDiv = document.getElementById('searchResults');
                resultsDiv.innerHTML = '';  // Clear previous results

                if (movies.length > 0) {
                    movies.forEach(movie => {
                        const movieDiv = document.createElement('div');
                        movieDiv.classList.add('mb-2', 'p-3', 'border', 'rounded', 'bg-light');
                        
                        // Extract and format movie details
                        const title = movie.title || 'Unknown Title';
                        const overview = movie.overview || 'No overview available';
                        const releaseDate = movie.release_date || 'Unknown Release Date';
                        const rating = movie.vote_average || 'N/A';
                        const budget = movie.budget ? `$${movie.budget.toLocaleString()}` : 'Unknown';
                        const revenue = movie.revenue ? `$${movie.revenue.toLocaleString()}` : 'Unknown';
                        const runtime = movie.runtime ? `${movie.runtime} minutes` : 'Unknown';
                        const tagline = movie.tagline || 'No tagline available';
                        const homepage = movie.homepage ? `<a href="${movie.homepage}" target="_blank">${movie.homepage}</a>` : 'No homepage available';
                        const originalLanguage = movie.original_language || 'Unknown';
                        const status = movie.status || 'Unknown';

                        // Parse JSON strings for genres, keywords, production companies, and languages
                        const genres = JSON.parse(movie.genres || '[]').map(genre => genre.name).join(', ') || 'N/A';
                        const keywords = JSON.parse(movie.keywords || '[]').map(keyword => keyword.name).join(', ') || 'N/A';
                        const productionCompanies = JSON.parse(movie.production_companies || '[]').map(company => company.name).join(', ') || 'N/A';
                        const spokenLanguages = JSON.parse(movie.spoken_languages || '[]').map(language => language.name).join(', ') || 'N/A';

                        // Display movie details
                        movieDiv.innerHTML = `
                            <h4>${title}</h4>
                            <p><strong>Tagline:</strong> ${tagline}</p>
                            <p><strong>Overview:</strong> ${overview}</p>
                            <p><strong>Release Date:</strong> ${releaseDate}</p>
                            <p><strong>Rating:</strong> ${rating}</p>
                            <p><strong>Budget:</strong> ${budget}</p>
                            <p><strong>Revenue:</strong> ${revenue}</p>
                            <p><strong>Runtime:</strong> ${runtime}</p>
                            <p><strong>Status:</strong> ${status}</p>
                            <p><strong>Homepage:</strong> ${homepage}</p>
                            <p><strong>Original Language:</strong> ${originalLanguage}</p>
                            <p><strong>Genres:</strong> ${genres}</p>
                            <p><strong>Keywords:</strong> ${keywords}</p>
                            <p><strong>Production Companies:</strong> ${productionCompanies}</p>
                            <p><strong>Spoken Languages:</strong> ${spokenLanguages}</p>
                        `;

                        resultsDiv.appendChild(movieDiv);
                    });
                } else {
                    resultsDiv.innerHTML = '<p>No movies found.</p>';
                }
            } else {
                console.error("Search failed. Status:", response.status);
                alert("Failed to fetch movies. Please try again.");
            }
        } catch (error) {
            console.error("Error during search:", error);
            alert("An error occurred. Please try again.");
        }
    });
</script>

</body>
</html>
